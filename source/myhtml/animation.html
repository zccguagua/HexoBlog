<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, minimum-scale=0.5, maximum-scale=0.5">
    <title>动画</title>
    <style type="text/css">
        #container > div {
            top: 60px !important;
            left: 50px !important;
        }
    </style>
</head>
<body>
<div id="container"></div>
<script type="text/javascript" src="../js/animation/three.min.js"></script>
<script type="text/javascript" src="../js/animation/Detector.js"></script>
<script type="text/javascript" src="../js/animation/stats.min.js"></script>
<script type="text/javascript" src="../js/animation/OrbitControls.js"></script>
<script type="text/javascript" src="../js/animation/DRACOLoader.js"></script>
<script type="text/javascript" src="../js/animation/GLTFLoader.js"></script>

<script>
    var scene, camera, pointLight, stats;
    var renderer, mixer, controls;

    var clock = new THREE.Clock();
    var container = document.getElementById('container');

    stats = new Stats();
    container.appendChild(stats.dom);

    renderer = new THREE.WebGLRenderer({
        antialias: true
    });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.gammaOutput = true;
    renderer.gammaFactor = 2.2;
    container.appendChild(renderer.domElement);

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xbfe3dd);

    camera = new THREE.PerspectiveCamera(40, window.innerWidth
        / window.innerHeight, 1, 100);
    camera.position.set(5, 2, 8);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.5, 0);
    controls.enablePan = false;

    scene.add(new THREE.AmbientLight(0x404040));

    pointLight = new THREE.PointLight(0xffffff, 1);
    pointLight.position.copy(camera.position);
    scene.add(pointLight);

    // envmap
    var path = 'textures/cube/Park2/';
    var format = '.jpg';
    var envMap = new THREE.CubeTextureLoader().load([
        path + 'posx' + format, path + 'negx' + format,
        path + 'posy' + format, path + 'negy' + format,
        path + 'posz' + format, path + 'negz' + format]);

    THREE.DRACOLoader.setDecoderPath('../js/animation/gltf/');

    var loader = new THREE.GLTFLoader();
    loader.setDRACOLoader(new THREE.DRACOLoader());
    loader.load('../js/animation/LittlestTokyo.glb', function (gltf) {

        var model = gltf.scene;
        model.position.set(1, 1, 0);
        model.scale.set(0.01, 0.01, 0.01);
        model.traverse(function (child) {

            if (child.isMesh)
                child.material.envMap = envMap;

        });

        scene.add(model);

        mixer = new THREE.AnimationMixer(model);
        mixer.clipAction(gltf.animations[0]).play();

        animate();

    }, undefined, function (e) {

        console.error(e);

    });

    window.onresize = function () {

        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();

        renderer.setSize(window.innerWidth, window.innerHeight);

    };
    alert("正在加载，稍等片刻");

    function animate() {
        requestAnimationFrame(animate);
        var delta = clock.getDelta();
        mixer.update(delta);
        controls.update(delta);
        stats.update();
        renderer.render(scene, camera);
    }

</script>

</body>
</html>
