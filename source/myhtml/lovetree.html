<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>时间树</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link type="text/css" rel="stylesheet"
          href="../js/lovetree/default.css">
    <style type="text/css">
        #clock-box > span {
            color: #666666;
        }
    </style>
    <script type="text/javascript" src="../js/lovetree/jquery.min.js"></script>
    <script type="text/javascript" src="../js/lovetree/jscex.min.js"></script>
    <script type="text/javascript" src="../js/lovetree/jscex-parser.js"></script>
    <!--<script type="text/javascript" src="../js/love.js"></script>-->
    <!--鼠标点击爱心-->
    <script>
        var lover = {};
        lover.info = {
            name: "Click Heart",
            year: 2026,
            month: 1,
            day: 1,
            hour: 0,
            minute: 0,
            second: 0,
            debug: true //是否开启调试模式（如果选是，则会弹窗提示为什么加载出错）
        }
    </script>
</head>
<body>
<!-- 背景音乐部分 -->
<audio id="loveBgm" src="../music/suiyueshentou.mp3" loop="loop"></audio>

<div id="main">
    <div id="error"></div>
    <div id="wrap">
        <div id="text">
            <div id="code">
                <span class="say">从明天起，和每一个亲人通信</span><br> <span class="say">
					</span><br> <span class="say">告诉他们我的幸福</span><br> <span
                    class="say"> </span><br> <span class="say">那幸福的闪电告诉我的</span><br>
                <span class="say"> </span><br> <span class="say">我将告诉每一个人</span><br>
                <span class="say"> </span><br> <span class="say">给每一条河每一座山取一个温暖的名字</span><br>
                <span class="say"> </span><br> <span class="say">陌生人，我也为你祝福</span><br>
                <span class="say"> </span><br> <span class="say">愿你有一个一个灿烂的前程</span><br>
                <span class="say"> </span><br> <span class="say">愿你有情人终成眷属</span><br>
                <span class="say"> </span><br> <span class="say">愿你在尘世间获得幸福</span><br>
                <span class="say"> </span><br> <span class="say">
						我只愿面朝大海，春暖花开</span>
            </div>
        </div>
        <div id="clock-box">
            <span>2026年已经过去</span>

            <div id="clock"></div>
        </div>
        <canvas id="canvas" width="100px" height="500px"></canvas>
    </div>
</div>

<script type="text/javascript" src="../js/lovetree/jscex-jit.js"></script>
<script type="text/javascript" src="../js/lovetree/jscex-builderbase.min.js"></script>
<script type="text/javascript" src="../js/lovetree/jscex-async.min.js"></script>
<script type="text/javascript" src="../js/lovetree/jscex-async-powerpack.min.js"></script>
<script type="text/javascript" src="../js/lovetree/functions.js" charset="utf-8"></script>
<script type="text/javascript" src="../js/lovetree/love.js" charset="utf-8"></script>
<script type="text/javascript" src="../js/lovetree/canvas.js" charset="utf-8"></script>
</body>
</html>
